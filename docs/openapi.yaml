    "/health": {
      "get": {
        "operationId": "health",
        "summary": "Vivacité du processus uniquement, sans test DB",
        "x-implementation-status": "implemented",
        "responses": {
          "200": {
            "description": "Réponse conforme au contrat",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Health"
                }
              }
            }
          }
        }
      }
    },
    "/api/v1/capabilities": {
      "get": {
        "operationId": "capabilities",
        "summary": "capabilities",
        "x-implementation-status": "implemented",
        "responses": {
          "200": {
            "description": "Réponse conforme au contrat",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Capabilities"
                },
                "example": {
                  "mode": "demo",
                  "countries": [
                    "FR"
                  ],
                  "modes": [
                    "train",
                    "coach"
                  ],
                  "coveredPairs": [
                    {
                      "originId": "demo-paris",
                      "destinationId": "demo-lyon"
                    },
                    {
                      "originId": "demo-lyon",
                      "destinationId": "demo-paris"
                    }
                  ],
                  "limits": {
                    "maxTravelers": 9,
                    "maxResultsPerDirection": 20,
                    "maxBodyBytes": 16384,
                    "bookingAvailable": false
                  },
                  "warnings": [
                    "Catalogue et trajets entièrement synthétiques; aucune bascule vers un fournisseur réel."
                  ]
                }
              }
            }
          },
          "400": {
            "description": "JSON malformé",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "404": {
            "description": "Ressource inconnue",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "405": {
            "description": "Méthode non autorisée",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "413": {
            "description": "Corps trop grand",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "415": {
            "description": "Type de contenu non pris en charge",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "422": {
            "description": "Critères invalides",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            }
          },
          "429": {
            "description": "Limite atteinte; Retry-After en secondes",
            "content": {
              "application/problem+json": {
                "schema": {
                  "$ref": "#/components/schemas/Problem"
                }
              }
            },
            "headers": {
              "Retry-After": {
                "schema": {
                  "type": "integer",
                  "minimum": 1
                },
                "description": "Délai en secondes"
