name: ecotrip-task0001
services:
  app:
    build: .
    image: ecotrip-task0001-php
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes: [".:/app"]
    ports: ["127.0.0.1:${HTTP_PORT:-18081}:8000"]
    environment:
      APP_ENV: dev
      APP_DEBUG: "0"
      APP_SECRET: "${APP_SECRET:?See README}"
      DB_HOST: database
      DB_NAME: ecotrip
      DB_USER: ecotrip
      DB_PASSWORD: "${POSTGRES_PASSWORD:?See README}"
      COMPOSER_HOME: /app/var/composer
    depends_on:
      database:
        condition: service_healthy
  database:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: ecotrip
      POSTGRES_USER: ecotrip
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?See README}"
    volumes: ["database_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrip -d ecotrip"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  database_data:
