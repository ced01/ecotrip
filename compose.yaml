name: ecotrip

x-database-environment: &database-environment
  DB_HOST: database
  DB_NAME: ecotrip
  DB_USER: ecotrip
  DB_PASSWORD: "${POSTGRES_PASSWORD:?Generate .env.local as documented}"

x-app-environment: &app-environment
  <<: *database-environment
  APP_SECRET: "${APP_SECRET:?Generate .env.local as documented}"
  TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
  ECOTRIP_PLACE_PROVIDER: "${ECOTRIP_PLACE_PROVIDER:-demo}"

services:
  database:
    image: postgres:17.9-bookworm
    environment:
      POSTGRES_DB: ecotrip
      POSTGRES_USER: ecotrip
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Generate .env.local as documented}"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecotrip -d ecotrip"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  app:
    build:
      context: .
      target: production
    image: ecotrip-app:local
    environment:
      <<: *app-environment
      APP_ENV: prod
      APP_DEBUG: "0"
    ports:
      - "127.0.0.1:${HTTP_PORT:-18081}:8000"
    depends_on:
      database:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  dev:
    profiles: ["tools"]
    build:
      context: .
      target: development
    image: ecotrip-dev:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *app-environment
      APP_ENV: dev
      APP_DEBUG: "${DEV_APP_DEBUG:-1}"
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:${DEV_HTTP_PORT:-18082}:8000"
    depends_on:
      database:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  test:
    profiles: ["tools"]
    build:
      context: .
      target: development
    image: ecotrip-dev:local
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      <<: *app-environment
      APP_ENV: test
      APP_DEBUG: "0"
      COMPOSER_HOME: /tmp/composer
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  ui-test:
    profiles: ["tools"]
    image: node:22.22.0-bookworm-slim
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /app
    volumes:
      - .:/app
    command: npm run test:ui
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  database_data:
