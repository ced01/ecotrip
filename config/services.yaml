parameters:
  env(TRUSTED_PROXIES): ''

imports:
  - { resource: services/places.yaml }
  - { resource: services/journeys.yaml }
  - { resource: services/emissions.yaml }

services:
  _defaults:
    autowire: true
    autoconfigure: true
  App\:
    resource: '../src/'
    exclude:
      - '../src/Kernel.php'
      - '../src/Accommodation/'
      - '../src/Place/PlaceProviderFactory.php'
      - '../src/Journey/JourneyProviderFactory.php'
      - '../src/Environmental/EmissionFactorRepositoryFactory.php'
      - '../src/Environmental/AdemePublicationRegistry.php'

  App\Provider\DemoAccommodationProvider: ~
  App\Provider\AccommodationProvider: '@App\Provider\DemoAccommodationProvider'
  App\Provider\CapabilitiesProvider: '@App\Demo\DemoPlaceCatalog'

  App\Http\JourneySearchQuota:
    arguments:
      $limiter: '@limiter.journey_search'
      $clock: '@clock'
